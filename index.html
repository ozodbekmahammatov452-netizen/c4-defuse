<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>C4 — Defuse</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#404040;--panel:#1d2024e6;--text:#ececec;--muted:#a3a8ae;--accent:#f5a623;--red:#ff3b30;--ok:#3ddc84;--line:#444a52}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--panel:#f4f5f6ee;--text:#1c1c1c;--muted:#555;--line:#bfc3c8}}
:root[data-theme="dark"]{--panel:#1d2024e6;--text:#ececec;--muted:#a3a8ae;--line:#444a52}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:system-ui,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;overflow-x:hidden}
.scene{position:relative;width:min(100vw,1343px,calc(100vh*1.644));flex:0 0 auto}
.view{position:relative;width:100%}
.stage{position:relative;width:100%;aspect-ratio:1343/817;user-select:none}
.stage img{display:block;width:100%;height:100%;-webkit-user-drag:none}
.stage.shake{animation:sh .35s}
@keyframes sh{20%{transform:translateX(-.7%)}60%{transform:translateX(.7%)}}
.lcd{position:absolute;left:0;top:0;width:100%;height:100%;
color:#ff2a1a;mix-blend-mode:screen;pointer-events:none}
.lcd.ok{color:#3ddc84}.lcd.bad{color:#ffb0a0}
.r{display:flex;align-items:center;justify-content:center;gap:1.4cqw}
#r1{height:24cqh;gap:.9cqw}#r2{height:62cqh;gap:1.3cqw}
.dg,.cl,.pt{height:100%;width:auto;filter:drop-shadow(0 0 3px currentColor)}
.on{fill:currentColor}.off{fill:currentColor;opacity:.09}
.key{position:absolute;width:3.1%;height:5.2%;transform:translate(-50%,-50%);border-radius:6px;cursor:pointer;background:transparent;border:0;padding:0;-webkit-tap-highlight-color:transparent}
.key:active{background:#ffffff40}
.side{position:absolute;left:61%;top:50%;transform:translateY(-50%);width:max(33%,270px);background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:24px;text-align:center;backdrop-filter:blur(4px)}
.timer{font:700 clamp(30px,3.4vw,46px) ui-monospace,Menlo,monospace;color:var(--red);text-shadow:0 0 10px #f004;margin-bottom:10px;letter-spacing:.04em}
.tag{color:var(--muted);font-size:14px;letter-spacing:.08em;text-transform:uppercase}
.expr{font:700 clamp(30px,3.6vw,50px) ui-monospace,Menlo,monospace;margin:16px 0;min-height:56px}
.dots{display:flex;gap:8px;justify-content:center;margin:12px 0}
.dots i{width:14px;height:14px;border-radius:50%;background:var(--line)}
.dots i.d{background:var(--ok)}.dots i.c{background:var(--accent)}
.hint{color:var(--muted);font-size:14px}
.btn{padding:12px 18px;border-radius:8px;border:2px solid var(--line);background:transparent;color:var(--text);font-size:16px;cursor:pointer}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#1b1200;font-weight:700}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.hide{display:none!important}
.menu{position:fixed;inset:0;background:#000c;display:flex;align-items:center;justify-content:center;padding:20px;z-index:5;overflow:auto}
.card{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:14px;padding:26px;width:min(100%,400px)}
.card h1{margin:0 0 4px;font-size:22px}
.card label{display:block;margin:16px 0 6px;color:var(--muted);font-size:13px;text-transform:uppercase;letter-spacing:.06em}
.seg{display:flex;gap:8px}
.seg .btn{flex:1;padding:9px 6px;font-size:15px}
.seg .btn.on{border-color:var(--accent);background:var(--accent);color:#1b1200;font-weight:700}
input[type=range]{width:100%;accent-color:var(--accent)}
.flash{position:fixed;inset:0;opacity:0;pointer-events:none;z-index:4}
.flash.boom{animation:fl 1.4s}
@keyframes fl{0%{opacity:1;background:#fff}20%{background:#ff9a1f;opacity:1}100%{opacity:0;background:#f00}}
html,body{touch-action:manipulation}
.pad{display:none;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.pad button{height:clamp(44px,8.5vh,64px);font:700 26px system-ui,sans-serif;border-radius:10px;border:2px solid var(--line);background:#2b3037;color:var(--text);cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.pad button:active{background:var(--accent);border-color:var(--accent);color:#1b1200}
@media (pointer:coarse){.pad{display:grid}}
@media (max-height:520px) and (orientation:landscape){
  .side{padding:8px;width:max(34%,230px)}
  .timer{margin-bottom:2px;font-size:26px}
  .tag,.hint{display:none}
  .expr{margin:6px 0;min-height:36px;font-size:30px}
  .dots{margin:6px 0}
  .pad{gap:5px;margin-top:6px}
  .pad button{height:clamp(34px,10vh,46px);font-size:20px}
}
@media (max-width:900px) and (orientation:portrait){
  body{display:block;overflow-y:auto}
  .scene{width:100%}
  .view{overflow:hidden;height:auto}
  .stage{width:100%;margin-left:0}
  .side{position:static;transform:none;width:calc(100% - 24px);margin:6px 12px 12px;padding:12px}
  .timer{margin-bottom:4px}
  .expr{font-size:clamp(28px,9vw,40px);margin:8px 0;min-height:44px}
  .dots{margin:8px 0}
  .tag,.hint{display:none}
  .pad{display:grid;gap:8px;margin-top:8px}
  .pad button{height:clamp(46px,8vh,64px)}
}
</style>
</head>

const SND={},SNDB={};
function b64buf(s){const bin=atob(s),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u.buffer}
let sndErr="";
function ensureCtx(){
  if(!ac){
    const AC=window.AudioContext||window.webkitAudioContext;
    if(!AC)return false;
    ac=new AC();master=ac.createGain();master.connect(ac.destination);
    for(const k in B64){try{const p=ac.decodeAudioData(b64buf(B64[k])).then(x=>{SNDB[k]=x;return x});SND[k]=p;p.catch(e=>{SND[k]=null;sndErr=String(e&&e.message||e)})}catch(e){SND[k]=null;sndErr=String(e)}}
  }
  master.gain.value=S.vol/100;return true;
}
function fallback(k){try{const a=new Audio("data:audio/mpeg;base64,"+B64[k]);a.volume=S.vol/100;a.play().catch(e=>{sndErr=String(e)})}catch(e){sndErr=String(e)}}
function playSnd(k){
  if(!ensureCtx()){fallback(k);return}
  try{ac.resume()}catch(e){}
  if(SNDB[k]){const s=ac.createBufferSource();s.buffer=SNDB[k];s.connect(master);s.start();return}
  Promise.resolve(SND[k]).then(buf=>{
    if(!buf){fallback(k);return}
    const s=ac.createBufferSource();s.buffer=buf;s.connect(master);s.start();
  }).catch(()=>fallback(k));
}
const playDefused=()=>playSnd("defused"),playStart=()=>playSnd("start");
// ---------- problems: one operation, answer is a single digit ----------
const R=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
function makeProblem(){
  const hard=S.diff==="hard";
  const op=["+","−","−","×","÷","÷"][R(0,5)];
  let a,b,r;
  if(op==="+"){r=R(2,9);a=R(1,r-1);b=r-a}
  else if(op==="−"){
    r=R(1,9);
    if(hard&&R(0,2)){b=R(5,90-r);a=b+r}else{b=R(1,9);a=b+r}
  }
  else if(op==="×"){
    const p=[[1,2],[1,3],[1,4],[1,5],[1,6],[1,7],[1,8],[1,9],[2,2],[2,3],[2,4],[3,3]][R(0,11)];
    [a,b]=R(0,1)?p:[p[1],p[0]];r=a*b;
  }
  else{
    r=R(1,9);
    if(hard&&R(0,2)){const mx=Math.floor(99/r);b=R(Math.min(10,mx),Math.min(40,mx));a=b*r}
    else{b=R(2,9);a=b*r}
  }
  return{t:`${a} ${op} ${b}`,v:r};
}

// ---------- LED 7-segment display on the bomb ----------
const SEGS={a:[10,2,40,9],f:[2,10,9,38],b:[49,10,9,38],g:[10,45.5,40,9],e:[2,52,9,38],c:[49,52,9,38],d:[10,89,40,9]};
const MAP={"0":"abcdef","1":"bc","2":"abdeg","3":"abcdg","4":"bcfg","5":"acdfg","6":"acdefg","7":"abc","8":"abcdefg","9":"abcdfg","-":"g"," ":""};
function digit(ch){
  const on=MAP[ch]||"";
  return `<svg class="dg" viewBox="0 0 60 100">`+Object.entries(SEGS).map(([n,[x,y,w,h]])=>`<rect class="${on.includes(n)?"on":"off"}" x="${x}" y="${y}" width="${w}" height="${h}" rx="3"/>`).join("")+`</svg>`;
}
const colon=`<svg class="cl" viewBox="0 0 20 100"><circle class="on" cx="10" cy="33" r="6"/><circle class="on" cx="10" cy="67" r="6"/></svg>`;

function ledDigit(i,ch){
  const on=MAP[ch]||"",pad=7,cell=(225.5-2*pad)/N,w=27,h=45,x=pad+i*cell+(cell-w)/2,y=(55-h)/2;
  return `<g transform="translate(${x} ${y}) scale(${w/60} ${h/100})">`+Object.entries(SEGS).map(([n,[sx,sy,sw,sh]])=>`<rect class="${on.includes(n)?"on":"off"}" x="${sx}" y="${sy}" width="${sw}" height="${sh}" rx="3"/>`).join("")+`</g>`;
}
// ---------- game ----------
let playing=false,over=false,cur,idx=0,code="",deadline=0,nextBeep=0,loop=null;
function drawLcd(left){
  const t=Math.max(0,Math.round(left*1000)),ss=String(Math.floor(t/1000)).padStart(2,"0"),ms=String(t%1000).padStart(3,"0");
  $("timer").textContent=ss+"."+ms;
  let h="";for(let i=0;i<N;i++)h+=ledDigit(i,i<code.length?code[i]:"-");
  $("led").innerHTML=h;
}
function drawTask(){
  $("task").textContent=`${tr("task")} ${Math.min(idx+1,N)} / ${N}`;
  $("dots").innerHTML=Array.from({length:N},(_,i)=>`<i class="${i<idx?"d":i===idx&&playing?"c":""}"></i>`).join("");
}
async function startGame(){
  if(busy)return;busy=true;stopBoom();initAudio();if(played)await pAd();busy=false;played=true;playStart();
  $("menu").classList.add("hide");$("end").classList.add("hide");$("play").classList.remove("hide");
  $("lcd").setAttribute("class","lcd");
  idx=0;code="";over=false;playing=true;pStart();
  deadline=performance.now()+S.time*1000;nextBeep=0;
  nextProblem();
  clearInterval(loop);loop=setInterval(frame,40);frame();
}
function nextProblem(){cur=makeProblem();$("expr").textContent=cur.t+" = ?";drawTask()}
function frame(){
  if(!playing)return;
  const now=performance.now(),left=(deadline-now)/1000;
  if(left<=0)return lose();
  drawLcd(left);
  if(now>=nextBeep){tick();nextBeep=now+(200+left*22)}
}
function press(k){
  if(!playing)return;
  if(!/^\d$/.test(k)){keySnd();return}
  if(+k===cur.v){
    keySnd();code+=k;idx++;
    if(idx>=N){win();return}
    nextProblem();
  }else{
    keySnd();wrong();deadline-=3000;
    const st=$("stage"),l=$("lcd");
    st.classList.remove("shake");void st.offsetWidth;st.classList.add("shake");
    l.classList.add("bad");setTimeout(()=>l.classList.remove("bad"),250);
  }
  drawLcd((deadline-performance.now())/1000);
}
function win(){
  playing=false;over=true;pStop();clearInterval(loop);
  drawLcd((deadline-performance.now())/1000);$("lcd").classList.add("ok");
  setTimeout(tetTet,120);setTimeout(playDefused,650);
  setTimeout(()=>finish(true),700);
}
function lose(){
  playing=false;over=true;pStop();clearInterval(loop);
  drawLcd(0);
  boom();const f=$("flash");f.classList.remove("boom");void f.offsetWidth;f.classList.add("boom");
  setTimeout(()=>finish(false),900);
}
function finish(w){
  $("play").classList.add("hide");$("end").classList.remove("hide");
  $("endt").textContent=tr(w?"win":"lose");
  $("endt").style.color=w?"var(--ok)":"var(--red)";
  $("endp").textContent=`${idx} / ${N}`+(w?` · ${tr("left")}: ${Math.max(0,((deadline-performance.now())/1000)).toFixed(1)} s`:"");
}

// ---------- keypad hotspots (percent of the full image) ----------
const cx=[41.1,44.8,48.5],cy=[53.6,60.1,66.5,72.9];
["1","2","3","4","5","6","7","8","9","*","0","#"].forEach((k,i)=>{
  const b=document.createElement("button");b.className="key";b.setAttribute("aria-label",k);
  b.style.left=cx[i%3]+"%";b.style.top=cy[Math.floor(i/3)]+"%";
  b.addEventListener("pointerdown",e=>{e.preventDefault();press(k)});
  $("stage").appendChild(b);
});
document.addEventListener("keydown",e=>{if(/^\d$/.test(e.key))press(e.key)});
const padEl=document.createElement("div");padEl.className="pad";
["1","2","3","4","5","6","7","8","9","","0",""].forEach(k=>{const b=document.createElement("button");b.type="button";b.textContent=k;if(!k)b.style.visibility="hidden";else b.addEventListener("pointerdown",e=>{e.preventDefault();press(k)});padEl.appendChild(b)});
$("play").appendChild(padEl);
$("start").onclick=startGame;
$("again").onclick=startGame;
$("tomenu").onclick=()=>$("menu").classList.remove("hide");
render();drawLcd(S.time);
</script>
</body>
</html>
